<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="100%" height="100%">
  <defs>
    <!-- Gradientes RGB -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0066"/>
      <stop offset="50%" stop-color="#9900FF"/>
      <stop offset="100%" stop-color="#00CCFF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0066"/>
      <stop offset="40%" stop-color="#9900FF"/>
      <stop offset="100%" stop-color="#00CCFF"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0066" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00CCFF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0066"/>
      <stop offset="100%" stop-color="#00CCFF"/>
    </linearGradient>
    
    <!-- Fuente redondeada (Nunito) -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;display=swap');
    </style>
  </defs>

  <!-- Fondo transparente -->
  <rect width="620" height="200" fill="transparent"/>

  <!-- Cuadrado redondeado con gradiente RGB (fondo del icono) -->
  <rect x="20" y="20" width="140" height="140" rx="28" fill="url(#bgGrad)" opacity="0.9"/>
  
  <!-- Borde sutil del cuadrado -->
  <rect x="20" y="20" width="140" height="140" rx="28" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

  <!-- Monitor dentro del cuadrado -->
  <g transform="translate(60, 40)">
    <!-- Base y soporte del monitor -->
    <rect x="30" y="100" width="60" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="52" y="85" width="16" height="18" rx="3" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Pantalla (fondo negro) -->
    <rect x="0" y="0" width="120" height="85" rx="14" fill="#0D0D0D"/>
    <rect x="4" y="4" width="112" height="73" rx="10" fill="#1A1A1A"/>
    
    <!-- Contenido de la pantalla con gradientes RGB -->
    <!-- Líneas de código -->
    <rect x="12" y="14" width="40" height="6" rx="3" fill="url(#lineGrad)"/>
    <rect x="12" y="26" width="60" height="6" rx="3" fill="url(#lineGrad)" opacity="0.7"/>
    <rect x="12" y="38" width="48" height="6" rx="3" fill="url(#lineGrad)"/>
    <rect x="12" y="50" width="65" height="6" rx="3" fill="url(#lineGrad)" opacity="0.7"/>
    
    <!-- Elementos gráficos redondeados -->
    <circle cx="88" cy="24" r="8" fill="none" stroke="url(#screenGrad)" stroke-width="2.5"/>
    <circle cx="88" cy="24" r="3" fill="url(#screenGrad)"/>
    
    <rect x="78" y="42" width="20" height="20" rx="6" fill="none" stroke="url(#screenGrad)" stroke-width="2.5"/>
    <circle cx="88" cy="52" r="5" fill="url(#screenGrad)" opacity="0.6"/>
    
    <!-- Línea de brillo inferior -->
    <line x1="10" y1="65" x2="100" y2="65" stroke="url(#screenGrad)" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Texto "orvex.art" en una sola línea con tipografía redondeada -->
  <g transform="translate(190, 115)">
    <text x="0" y="0" font-family="'Nunito', sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="2">
      orvex.art
    </text>
    <!-- Sutil sombra proyectada -->
    <text x="0" y="0" font-family="'Nunito', sans-serif" font-size="52" font-weight="900" fill="#000000" opacity="0.15" letter-spacing="2" transform="translate(2, 4)"/>
  </g>

  <!-- Línea decorativa inferior (opcional) -->
  <line x1="190" y1="155" x2="580" y2="155" stroke="url(#textGrad)" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
</svg>